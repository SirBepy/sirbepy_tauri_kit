name: Tauri Windows Release (reusable)

# Reusable release pipeline for the SirBepy Windows Tauri apps. A caller repo
# invokes it with:
#
#   jobs:
#     release:
#       uses: SirBepy/sirbepy_tauri_kit/.github/workflows/tauri-windows-release.yml@main
#       with: { asset-name: My-App }
#       secrets: inherit
#
# It resolves the version from the caller's package.json (source of truth),
# tags `<tag-prefix><version>` if that tag does not exist yet, builds the Windows
# bundle (NSIS + MSI), and publishes the installers - plus, when `sign` is true,
# an updater `latest.json` + `.sig` - to a GitHub Release on the CALLER's repo.
# `${{ github.repository }}` resolves to the caller, so the download URLs are
# per-app with no input.

on:
  workflow_call:
    inputs:
      asset-name:
        description: Base name for release assets, e.g. "Server-Supervisor".
        required: true
        type: string
      tag-prefix:
        description: Git tag prefix; the tag is <prefix><version>.
        required: false
        default: "v"
        type: string
      sign:
        description: Sign the bundle and emit updater artifacts (latest.json + .sig).
        required: false
        default: true
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version and tag
        id: check
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="${{ inputs.tag-prefix }}$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG not found. Will release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check.outputs.tag }}"
          git push origin "${{ needs.check.outputs.tag }}"

  build:
    needs: [check, tag]
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        # The kit is vendored as a submodule and the crates depend on it, so it
        # must be checked out or the build fails resolving tauri_kit_* crates.
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version into tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          # package.json is the source of truth; mirror it into the bundler config
          # and crate manifest so the installer carries the right version. (A
          # `pushnbump` bumps package.json + tauri.conf.json but NOT Cargo.toml,
          # so the Cargo.toml sync is load-bearing.) Build-time only, not committed.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc
          cache-on-failure: true

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: src-tauri
        # cargo-tauri (the tauri-cli binary), not `cargo tauri`, to avoid the
        # rustup shim shadowing cargo's subcommand dispatch.
        run: cargo-tauri build --target x86_64-pc-windows-msvc

      - name: Stage artifacts
        shell: bash
        working-directory: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAG="${{ needs.check.outputs.tag }}"
          NAME="${{ inputs.asset-name }}"
          SIGN="${{ inputs.sign }}"
          mkdir -p "$GITHUB_WORKSPACE/release-staging"

          # NSIS installer doubles as the updater payload.
          EXE=$(ls nsis/*-setup.exe | head -n 1)
          ASSET="${NAME}_${VERSION}_windows_x64-setup.exe"
          cp "$EXE" "$GITHUB_WORKSPACE/release-staging/$ASSET"

          # MSI for users who prefer it (not part of the updater payload).
          if ls msi/*.msi >/dev/null 2>&1; then
            MSI=$(ls msi/*.msi | head -n 1)
            cp "$MSI" "$GITHUB_WORKSPACE/release-staging/${NAME}_${VERSION}_windows_x64.msi"
          fi

          # Updater payload: signature + a per-platform {signature,url} fragment
          # that the publish job merges into latest.json.
          if [ "$SIGN" = "true" ]; then
            cp "${EXE}.sig" "$GITHUB_WORKSPACE/release-staging/${ASSET}.sig"
            SIG=$(cat "${EXE}.sig")
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
            jq -n --arg sig "$SIG" --arg url "$URL" \
              '{signature:$sig, url:$url}' \
              > "$GITHUB_WORKSPACE/release-staging/windows-x86_64.json"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: release-staging/

  publish:
    needs: [check, tag, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: release-*
          merge-multiple: true

      - name: Generate latest.json
        if: inputs.sign
        shell: bash
        working-directory: artifacts
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PLATFORMS="{}"
          # Merge every per-platform fragment (e.g. windows-x86_64.json) into a
          # single platforms map keyed by the updater target.
          for f in *.json; do
            KEY="${f%.json}"
            PLATFORMS=$(jq --arg k "$KEY" --slurpfile p "$f" \
              '. + {($k): $p[0]}' <<< "$PLATFORMS")
          done
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Release $VERSION" \
            --arg pub_date "$DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:$platforms}' \
            > latest.json
          cat latest.json

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Missing globs (e.g. *.sig / latest.json when sign is false) are
          # skipped, not fatal. windows-x86_64.json is an intermediate, not listed.
          files: |
            artifacts/*.exe
            artifacts/*.exe.sig
            artifacts/*.msi
            artifacts/latest.json
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          draft: false
          make_latest: "true"
